version: '3.8'

services:
  # A KAPUŐR: kezeli a domaint és az SSL-t
  proxy:
    image: 'jc21/nginx-proxy-manager:latest'
    restart: always
    ports:
      - '80:80'
      - '443:443'
      - '81:81' # Ezt az AWS Security Groupban csak a te IP-dre nyisd meg!
    volumes:
      - ./proxy/data:/data
      - ./proxy/letsencrypt:/etc/letsencrypt
    networks:
      - vbf-network

  frontend:
    build: ./frontend
    # NINCS PORTS! A proxy fogja elérni belül.
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    networks:
      - vbf-network

  backend:
    build: ./backend
    # NINCS PORTS!
    volumes:
      - vbf_data:/app/data
    environment:
      - DATABASE_PATH=/app/data/vbf_database.db
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: always
    networks:
      - vbf-network

  db-backup:
    image: alpine:latest
    volumes:
      - vbf_data:/app/data:ro
      - vbf_backups:/backups
    entrypoint: /bin/sh
    command: >
      -c "
        apk add --no-cache sqlite &&
        DATE=$$(date +%Y%m%d_%H%M%S) &&
        sqlite3 /app/data/vbf_database.db \".backup '/backups/vbf_backup_$$DATE.db'\" &&
        find /backups -name 'vbf_backup_*.db' -mtime +30 -delete
      "
    profiles:
      - backup
    networks:
      - vbf-network

networks:
  vbf-network:
    driver: bridge

volumes:
  vbf_data:
  vbf_backups:
