name: VBF CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ═══════════════════════════════════════
  # 1. Backend tesztek és lint
  # ═══════════════════════════════════════
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8
      
      - name: Ensure data dir
        run: mkdir -p data
      
      - name: Alembic migration applies (SQLite)
        env:
          SKIP_DB_INIT: "1"
        run: |
          rm -f data/ci_alembic_apply.db
          export DATABASE_URL="sqlite:///$(pwd)/data/ci_alembic_apply.db"
          alembic upgrade head
          alembic current
      
      - name: Import check
        env:
          TESTING: '1'
        run: python -c "from main import app; print('import OK')"
      
      - name: Run unit tests
        env:
          TESTING: '1'
        run: |
          python -m pytest tests/ -v --tb=long -x --junitxml=test-results.xml 2>&1 | tee pytest.log
          exit ${PIPESTATUS[0]}
      
      - name: Pytest output (on failure)
        if: failure()
        run: |
          echo "## Backend test failure – last 120 lines" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          (test -f pytest.log && tail -n 120 pytest.log || echo "No pytest.log") >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      
      - name: Lint with flake8
        continue-on-error: true
        run: |
          flake8 . --count --select=E9,F821 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=12 --statistics
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results.xml

  # ═══════════════════════════════════════
  # 2. Frontend: HTML ellenőrzés + Vite build
  # ═══════════════════════════════════════
  frontend-check:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      # A Vite build folyamat automatikusan validálja az entry pointot (index.html) és a függőségeket
      
      - name: Install and build frontend
        run: |
          cd frontend
          npm ci || npm install
          npm run build

  # ═══════════════════════════════════════
  # 3. Docker build teszt
  # ═══════════════════════════════════════
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-check]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build backend Docker image
        run: docker build -t vbf-backend:test ./backend
      
      - name: Build frontend Docker image
        run: docker build -t vbf-frontend:test ./frontend
      
      - name: Test backend container starts
        run: |
          docker run -d --name vbf-test -p 8000:8000 vbf-backend:test
          sleep 5
          curl -f http://localhost:8000/docs || exit 1
          docker logs vbf-test
          docker stop vbf-test
      
      - name: Docker Compose validation
        run: |
          if [ -f docker-compose.yml ]; then docker compose -f docker-compose.yml config --quiet; else echo "No docker-compose.yml, skip"; fi
          if [ -f docker-compose.postgres.yml ]; then docker compose -f docker-compose.yml -f docker-compose.postgres.yml config --quiet; fi

  # ═══════════════════════════════════════
  # 4. Security scan
  # ═══════════════════════════════════════
  security-scan:
    runs-on: ubuntu-latest
    needs: [backend-test]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Check for hardcoded secrets
        run: |
          # Search for potential secrets in code
          echo "Scanning for hardcoded secrets..."
          ! grep -rn "sk_live\|sk_test_[a-zA-Z0-9]\{20,\}\|password\s*=\s*['\"][^'\"]\{8,\}['\"]" \
            --include="*.py" --include="*.js" --include="*.tsx" --include="*.ts" \
            --exclude-dir=node_modules --exclude-dir=__pycache__ \
            backend/ frontend/src/ || echo "⚠️ Potential secrets found - review needed"
      
      - name: Python dependency vulnerability scan
        run: |
          pip install pip-audit
          cd backend && pip-audit -r requirements.txt || echo "⚠️ Vulnerabilities found"
