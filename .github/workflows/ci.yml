name: VBF CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ═══════════════════════════════════════
  # 1. Backend tesztek és lint
  # ═══════════════════════════════════════
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8
      
      - name: Ensure data dir
        run: mkdir -p data
      
      - name: Import check
        env:
          TESTING: '1'
        run: python -c "from main import app; print('import OK')"
      
      - name: Run unit tests
        env:
          TESTING: '1'
        run: |
          python -m pytest tests/ -v --tb=short --junitxml=test-results.xml
      
      - name: Lint with flake8
        continue-on-error: true
        run: |
          flake8 . --count --select=E9,F821 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=12 --statistics
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results.xml

  # ═══════════════════════════════════════
  # 2. Frontend: HTML ellenőrzés + Vite build
  # ═══════════════════════════════════════
  frontend-check:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Check HTML entry point
        run: |
          python -c "
          import re
          with open('frontend/app.html', 'r', encoding='utf-8') as fh:
              content = fh.read()
              scripts = re.findall(r'<script[^>]*src=\"([^\"]+)\"', content)
              if 'js/main.js' not in str(scripts) and 'main.js' not in str(scripts) and 'app.js' not in str(scripts):
                  raise Exception('app.html must load main.js or app.js')
          if not open('frontend/index.html').read():
              raise Exception('index.html missing')
          print('HTML entry OK')
          "
      
      - name: Install and build frontend
        run: |
          cd frontend
          npm ci || npm install
          npm run build

  # ═══════════════════════════════════════
  # 3. Docker build teszt
  # ═══════════════════════════════════════
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-check]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build backend Docker image
        run: docker build -t vbf-backend:test ./backend
      
      - name: Build frontend Docker image
        run: docker build -t vbf-frontend:test ./frontend
      
      - name: Test backend container starts
        run: |
          docker run -d --name vbf-test -p 8000:8000 vbf-backend:test
          sleep 5
          curl -f http://localhost:8000/docs || exit 1
          docker logs vbf-test
          docker stop vbf-test
      
      - name: Docker Compose validation
        run: |
          if [ -f docker-compose.yml ]; then docker compose config --quiet; else echo "No docker-compose.yml, skip"; fi

  # ═══════════════════════════════════════
  # 4. Security scan
  # ═══════════════════════════════════════
  security-scan:
    runs-on: ubuntu-latest
    needs: [backend-test]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Check for hardcoded secrets
        run: |
          # Search for potential secrets in code
          echo "Scanning for hardcoded secrets..."
          ! grep -rn "sk_live\|sk_test_[a-zA-Z0-9]\{20,\}\|password\s*=\s*['\"][^'\"]\{8,\}['\"]" \
            --include="*.py" --include="*.js" \
            --exclude-dir=node_modules --exclude-dir=__pycache__ \
            backend/ frontend/js/ || echo "⚠️ Potential secrets found - review needed"
      
      - name: Python dependency vulnerability scan
        run: |
          pip install pip-audit
          cd backend && pip-audit -r requirements.txt || echo "⚠️ Vulnerabilities found"
